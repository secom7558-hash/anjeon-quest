<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안전 퀘스트</title>
<meta name="theme-color" content="#142a25">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안전 퀘스트">
<style>
:root{--bg:#142a25;--card:#1d3932;--card2:#26463d;--track:#38564b;--ink:#f1f0e8;--mute:#c0cbc1;--gold:#d2c18a;--goldink:#28362d;--xp:#c4d59f;--step:#aabd9e;--stepink:#17342d;--ok:#a3c9aa;--okink:#183c29;--bad:#e99583;--badink:#46221d;--line:#38564b;--shadow:0 10px 28px rgba(5,18,15,.22);color-scheme:dark}
:root[data-theme="light"]{--bg:#f1efe7;--card:#fbfaf5;--card2:#eeece2;--track:#ddd9ce;--ink:#26352f;--mute:#626f66;--gold:#b18b4c;--goldink:#29281f;--xp:#557960;--step:#dce6d8;--stepink:#294332;--ok:#37684a;--okink:#f8fbf7;--bad:#a6473d;--badink:#fff8f5;--line:#d8d4c8;--shadow:0 8px 22px rgba(49,53,42,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px 12px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 4px;max-width:560px;margin:0 auto}
.brand{font-size:11px;letter-spacing:.18em;color:var(--mute)}
.brand b{color:var(--ink);font-size:17px;letter-spacing:.02em;display:block;font-weight:800}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.h2{font-size:17px;font-weight:800;margin:20px 2px 4px}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--xp);border-radius:6px;transition:width .6s}
.av{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--goldink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.av small{font-size:10px;font-weight:700}
.av b{font-size:20px}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-xp{color:var(--xp)}.c-gold{color:var(--gold)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--track);color:var(--ink);vertical-align:middle;white-space:nowrap}
.pill.ok{background:var(--ok);color:#0b2a17}.pill.bad{background:var(--bad);color:var(--badink)}.pill.st{background:var(--step);color:var(--stepink)}.pill.gold{background:var(--gold);color:var(--goldink)}
.seg{display:flex;gap:6px;margin-top:14px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font-weight:800;padding:10px 0;border-radius:10px;font-size:15px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--goldink)}
.qc{display:flex;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:10px;margin-top:10px;box-shadow:var(--shadow);align-items:center}
.qc .ph{width:76px;height:76px;border-radius:12px;background:var(--track);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.qc .ph img{width:100%;height:100%;object-fit:cover}
.qc .tx{flex:1;min-width:0}
.qc .t{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--track)}
.thumbs.one img{width:100%;height:auto;max-height:340px;object-fit:contain;background:var(--card2)}
.big{display:block;width:100%;border:0;border-radius:24px;padding:15px;font-weight:800;font-size:17px;background:var(--gold);color:var(--goldink);margin-top:14px}
.big:disabled{opacity:.6}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.on{background:var(--step);color:var(--stepink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--goldink);border-color:transparent}
.btn.ok{background:var(--ok);color:#0b2a17;border-color:transparent}
.btn.bad{color:var(--bad)}
.lnk{border:0;background:none;color:var(--mute);font-size:13px;padding:4px;text-decoration:underline}
textarea,input[type=text],input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{border-color:var(--xp)}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pics div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--track)}
.pics img{width:100%;height:100%;object-fit:cover}
.pics .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;line-height:1}
.pics .add{border:2px dashed var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:13px;width:100%;height:100%;border-radius:12px}
.pics .add b{font-size:28px;line-height:1}
.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:var(--card2);color:var(--bad);text-align:center;padding:4px;overflow:hidden}
.pdf b{font-size:18px;letter-spacing:.04em}
.pdf small{color:var(--mute);font-size:11px;line-height:1.2;max-height:2.4em;overflow:hidden;word-break:break-all}
.thumbs .pdfa{display:block;width:96px;height:96px;border-radius:12px;overflow:hidden;text-decoration:none;border:1px solid var(--line)}
.prob{border:2px solid var(--gold)}
.ch{margin-top:12px}
.ch .who{font-weight:800}
.reply{border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px;font-size:14px}
.reply b{font-weight:700;margin-right:6px}
.rin{display:flex;gap:8px;margin-top:10px}
.rin input{flex:1;padding:9px 12px}
.adm{border:2px dashed var(--gold);border-radius:14px;padding:10px;margin-top:10px}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line);z-index:5}
nav.tab button{border:0;background:none;color:var(--mute);font-size:12px;font-weight:700;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tab button[aria-current=page]{color:var(--xp)}
nav.tab svg{width:24px;height:24px}
nav.tab .post{background:var(--gold);color:var(--goldink);border-radius:16px;padding:6px 18px}
.dot{position:absolute;top:2px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0) scale(.8);background:var(--gold);color:var(--goldink);font-weight:800;font-size:22px;padding:14px 26px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast small{display:block;font-size:13px;font-weight:600}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.names button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 4px;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keys button{border:0;background:var(--card2);border-radius:14px;padding:16px 0;font-size:22px;font-weight:800}
.pin{display:flex;justify-content:center;gap:14px;margin-top:16px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}
.pin i.f{background:var(--gold);border-color:var(--gold)}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:96vw;max-height:92vh;display:block;border-radius:8px}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:31%;margin:1%;padding:10px 4px;border-radius:14px;background:var(--card2);font-size:12px;text-align:center;color:var(--mute)}
.badge b{font-size:26px;line-height:1.1;filter:grayscale(1);opacity:.35}
.badge.got{color:var(--ink)}
.badge.got b{filter:none;opacity:1}
.pl{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.pl:first-child{border-top:0}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.load{text-align:center;color:var(--mute);padding:40px 0}

/* 포레스트·스톤 테마의 공통 마감 */
html{scrollbar-color:var(--track) var(--bg);scrollbar-width:thin}
::selection{background:var(--gold);color:var(--goldink)}
:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
body{transition:background-color .22s,color .22s}
.card,.qc,.seg,nav.tab,.btn,.big,.names button,.keys button,textarea,input[type=text],input[type=password]{transition:background-color .22s,color .22s,border-color .22s,box-shadow .22s,transform .18s}
.card{border:1px solid var(--line);border-radius:14px}
.h2{margin-top:24px;letter-spacing:-.025em}
.brand{letter-spacing:.14em}
.brand b{letter-spacing:-.035em}
.av{border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.pill{border-radius:8px;letter-spacing:-.01em}
.pill.ok{background:var(--ok);color:var(--okink)}
.pill.bad{background:var(--bad);color:#43211c}
.pill.st{background:var(--step);color:var(--stepink)}
.pill.gold{background:var(--gold);color:var(--goldink)}
.seg{border:1px solid var(--line);border-radius:12px}
.qc{border:1px solid var(--line);border-radius:14px}
.big{border-radius:14px;box-shadow:0 6px 16px rgba(8,20,16,.12)}
.btn{border-radius:10px}
.btn.ok{background:var(--ok);color:var(--okink)}
textarea,input[type=text],input[type=password]{border-radius:10px}
textarea::placeholder,input::placeholder{color:var(--mute);opacity:.86}
nav.tab{box-shadow:0 -5px 20px rgba(4,15,12,.12);border-top:1px solid var(--line)}
nav.tab .post{border-radius:12px}
.toast{border-radius:14px;box-shadow:0 12px 34px rgba(4,15,12,.24)}
.adm{border-color:var(--gold);border-style:solid}
@media(hover:hover){.btn:hover,.names button:hover,.keys button:hover{transform:translateY(-1px);border-color:var(--gold)}.big:hover{transform:translateY(-1px);filter:brightness(1.04)}.qc:hover{border-color:var(--gold)}}
@media(max-width:380px){.wrap{padding-left:13px;padding-right:13px}.top{padding-left:13px;padding-right:13px}.card{padding:12px}.big{font-size:16px}}
</style>
</head>
<body>
<div class="top"><div class="brand">HYUNDAI IMC<b>안전 퀘스트</b></div><button class="lnk" id="themeBtn" type="button">밝은 화면</button></div>
<main class="wrap" id="app"><div class="load">불러오는 중입니다…</div></main>
<nav class="tab" id="tab" hidden>
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈<i class="dot" id="homeDot" hidden></i></button>
  <button data-go="post" class="post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>제안하기</button>
  <button data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>내 기록<i class="dot" id="meDot" hidden></i></button>
</nav>
<div class="toast" id="toast"></div>
<dialog id="dlg"><img id="dlgImg" alt="사진"></dialog>
<input type="file" id="fileIn" accept="image/*,application/pdf,.pdf" multiple hidden>

<script>
var SUPA='https://ayenfffxeifvkpfawamu.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5ZW5mZmZ4ZWlmdmtwZmF3YW11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NDcyNDYsImV4cCI6MjExMDQyMzI0Nn0.DpgGG2AxfFKjQO8OuN4IE9GMAhC40ipNcPwqJ0CZ7uE';
var LV=[0,10,30,60,100,150,220,300,400,520,660,820,1000,1200,1500];
var LVN=['새싹','견습생','관찰자','실천가','개선러','개선 장인','안전 지킴이','안전 고수','안전 마스터','안전 영웅','안전 명인','전설','전설','전설','전설'];
var QUEST=['adopted','filmed','discussed'];   /* 퀘스트(채택된 제안) 상태 */
var TOK=null,ME=null,D={},busy=false,homeTab='q';

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function kst(d){return new Date(new Date(d).getTime()+9*3600e3)}
function ago(s){var d=new Date(s),m=Math.round((Date.now()-d)/60000);if(m<1)return '방금';if(m<60)return m+'분 전';if(m<1440)return Math.round(m/60)+'시간 전';var k=kst(d);if(m<10080)return Math.round(m/1440)+'일 전';return (k.getUTCMonth()+1)+'/'+k.getUTCDate()}
function ymd(s){var k=kst(s);return k.getUTCFullYear()+'.'+pad(k.getUTCMonth()+1)+'.'+pad(k.getUTCDate())}
function monthStartISO(){var k=kst(Date.now());return new Date(Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),1)-9*3600e3).toISOString()}
function yearOf(s){return kst(s).getUTCFullYear()}

/* ---------- 서버 ---------- */
function H(x){var h={apikey:KEY,Authorization:'Bearer '+KEY};for(var k in x)h[k]=x[k];return h}
function msgOf(t){try{var j=JSON.parse(t);return j.message||t}catch(e){return t}}
function netErr(e){if(e instanceof TypeError)throw new Error('인터넷 연결을 확인해 주세요');throw e}
function api(path,opt){opt=opt||{};opt.headers=H(opt.headers);
  return fetch(SUPA+path,opt).catch(netErr).then(function(r){
    if(!r.ok)return r.text().then(function(t){var m=msgOf(t)||('오류 '+r.status);if(/다시 로그인/.test(m)){logoutLocal();showLogin();throw new Error('다시 로그인해 주세요')}throw new Error(m)});
    return r.status===204?null:r.json().catch(function(){return null})})}
function get(p){return api('/rest/v1/'+p)}
/* 서버는 한 번에 1000줄까지만 줌 → 끝까지 나눠 받기(p에 순서 지정 필수) */
function getAll(p,step){step=step||1000;var out=[];function nx(o){return get(p+(p.indexOf('?')>=0?'&':'?')+'limit='+step+'&offset='+o).then(function(r){out=out.concat(r);return r.length<step?out:nx(o+step)})}return nx(0)}
function rpc(n,a){return api('/rest/v1/rpc/'+n,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a||{})})}
function pubUrl(p){return SUPA+'/storage/v1/object/public/photos/'+p.split('/').map(encodeURIComponent).join('/')}
function thumbP(p){return p.replace(/\.jpg$/,'_t.jpg')}
function isPdf(p){return /\.pdf$/i.test(p||'')}
/* body: dataURL 글자 또는 파일(Blob) */
function upload(path,body,type){return (typeof body==='string'?fetch(body).then(function(r){return r.blob()}):Promise.resolve(body)).then(function(b){
  return fetch(SUPA+'/storage/v1/object/photos/'+path,{method:'POST',headers:H({'Content-Type':type||'image/jpeg','cache-control':'max-age=31536000'}),body:b}).catch(netErr).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('올리기 실패: '+msgOf(t))})})})}
var PDF_MAX=10*1024*1024;
/* 고른 파일 하나 준비: PDF는 그대로(10MB까지), 사진은 줄이기 */
function prep(file){if(file.type==='application/pdf'||isPdf(file.name)){if(file.size>PDF_MAX)return Promise.reject(new Error('PDF는 10MB까지 올릴 수 있습니다 ('+file.name+')'));return Promise.resolve({pdf:true,f:file,name:file.name,p:null})}return shrink(file)}
/* 사진: 큰 것(긴 변 1200px) + 작은 것(320px) */
function shrink(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=function(){rej(new Error('사진을 읽지 못했습니다'))};r.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('이 사진 형식은 열 수 없습니다'))};im.onload=function(){
    function mk(L,q){var s=Math.min(1,L/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q)}
    res({d:mk(1200,.75),t:mk(320,.7),p:null})};im.src=r.result};r.readAsDataURL(file)})}
/* 아직 안 올린 것만 올리고 경로 목록을 돌려줌(실패해도 올린 것은 기억 → 다시 누르면 이어서) */
function uploadAll(arr){var i=0;function nx(){if(i>=arr.length)return Promise.resolve(arr.map(function(x){return x.p}));var it=arr[i++];if(it.p)return nx();
  var base=ME.member_id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  if(it.pdf){var q=base+'.pdf';return upload(q,it.f,'application/pdf').then(function(){it.p=q;return nx()})}
  var p=base+'.jpg';
  return upload(p,it.d).then(function(){return upload(thumbP(p),it.t)}).then(function(){it.p=p;return nx()})}return nx()}
/* 여러 개를 골라도 한 장씩 차례로 처리(고화소 사진 메모리 부족 방지) */
function picker(arr,max,done){var f=$('fileIn');f.value='';f.onchange=function(){var fs=[].slice.call(f.files,0,Math.max(0,max-arr.length)),errs=[];
  fs.reduce(function(pr,file){return pr.then(function(){return prep(file).then(function(x){arr.push(x);done()},function(e){errs.push(e.message)})})},Promise.resolve())
    .then(function(){done();if(errs.length)alert(errs.join('\n'))})};f.click()}
function pdfTile(name){return '<span class="pdf"><b>PDF</b>'+(name?'<small>'+esc(name)+'</small>':'')+'</span>'}
function picsEditor(box,arr,max,label){function draw(){box.innerHTML=arr.map(function(it,i){return '<div>'+(it.pdf||isPdf(it.p)?pdfTile(it.name):'<img src="'+(it.t||pubUrl(thumbP(it.p)))+'" alt="사진 '+(i+1)+'">')+'<button class="x" data-x="'+i+'" type="button" aria-label="빼기">×</button></div>'}).join('')+
  (arr.length<max?'<div><button class="add" type="button" data-add="1"><b>+</b>'+(label||'사진·PDF')+'</button></div>':'')}
  box.onclick=function(e){var x=e.target.closest('[data-x]');if(x){arr.splice(+x.dataset.x,1);draw();return}if(e.target.closest('[data-add]'))picker(arr,max,draw)};draw()}

function toast(t,sub){var e=$('toast');e.innerHTML=esc(t)+(sub?'<small>'+esc(sub)+'</small>':'');e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1700)}
function ptsToast(n,what){if(isAdmin())toast(what||'올렸습니다');else if(n>0)toast('+'+n+'점',what);else toast(what||'올렸습니다','오늘 작은 점수는 다 모았습니다')}

function chPill(i){if(i.status==='done')return '<span class="pill ok">클리어</span>';if(i.status==='doing')return '<span class="pill bad">보완 필요</span>';return '<span class="pill gold">확인 중</span>'}

function firstPic(ps){var p=(ps||[]).filter(function(x){return !isPdf(x)})[0];return p?'<img src="'+esc(pubUrl(thumbP(p)))+'" alt="" loading="lazy">':((ps||[]).length?pdfTile():'글')}
function setTheme(t){if(t==='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;
  $('themeBtn').textContent=t==='light'?'어두운 화면':'밝은 화면';document.querySelector('meta[name=theme-color]').content=t==='light'?'#f1efe7':'#142a25'}

function loadAll(){return Promise.all([
  getAll('members?select=id,name,team,role,active&order=name,id'),
  getAll('topics?select=*&order=created_at.desc,id.desc'),
  getAll('ideas?select=*&order=created_at.asc,id.asc'),
  get('scores?select=*'),
  getAll('points?select=member_id,pts,rule_key,at&at=gte.'+encodeURIComponent(monthStartISO())+'&order=id'),
  get('point_rules?select=*')
]).then(function(r){D.mem={};r[0].forEach(function(m){D.mem[m.id]=m});D.members=r[0];D.topics=r[1];D.ideas=r[2];D.scores=r[3];D.mpts=r[4];
  D.rules={};r[5].forEach(function(x){D.rules[x.key]=x});D.at=Date.now();updateDots()})}
function myScore(){var s=(D.scores||[]).filter(function(x){return x.member_id===ME.member_id})[0];return s?s.total:0}
function adminTodo(){return D.topics.filter(function(t){return t.status==='new'}).length+D.ideas.filter(function(i){return i.status==='review'}).length}
function updateDots(){if(!ME||!D.topics)return;var seen=+(lsGet('sa-seen')||0),n=0;
  D.topics.forEach(function(t){if(t.author_id===ME.member_id&&t.status!=='new'&&new Date(t.updated_at)>seen)n++});
  D.ideas.forEach(function(i){if(i.author_id===ME.member_id&&i.status!=='review'&&new Date(i.updated_at)>seen)n++});
  $('meDot').hidden=!n;$('homeDot').hidden=!(isAdmin()&&adminTodo())}

$('tab').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
function route(){var h=(location.hash||'#home').slice(1);if(!TOK){showLogin();return}

    if(p[0]==='post')return showPost();if(p[0]==='t')return showTopic(p[1]);if(p[0]==='c')return showChallengeForm(p[1],p[2]);if(p[0]==='me')return showMe();return showHome()

/* ---------- 로그인 ---------- */
/* 쓰던 제안(sa-draft)은 남김 — 다시 로그인한 뒤 이어서 올릴 수 있게. 직접 로그아웃할 때만 지움 */
function logoutLocal(){TOK=null;ME=null;D={};lsSet('sa-token',null);lsSet('sa-me',null)}
function showLogin(){$('tab').hidden=true;$('app').innerHTML='<div class="load">명단을 불러오는 중입니다…</div>';
  get('members?select=id,name,team,role,active&active=is.true&role=eq.staff&order=name').then(function(ms){var g={};ms.forEach(function(m){(g[m.team||'기타']=g[m.team||'기타']||[]).push(m)});
    $('app').innerHTML='<div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800">안전 퀘스트 접속</div><div class="mute">내 이름을 눌러 주세요</div></div>'+
      Object.keys(g).map(function(t){return '<div class="h2">'+esc(t)+'</div><div class="names">'+g[t].map(function(m){return '<button data-n="'+esc(m.name)+'" type="button">'+esc(m.name)+'</button>'}).join('')+'</div>'}).join('')+

  }).catch(function(e){$('app').innerHTML='<div class="card"><b>서버에 연결하지 못했습니다</b><p class="mute">'+esc(e.message)+'</p><button class="btn" onclick="showLogin()">다시 시도</button></div>'})}
var LOGIN_ERR={'번호 틀림':'번호가 맞지 않습니다','잠김':'여러 번 틀려 잠겼습니다. 잠시 뒤 다시 하거나 운영진에게 말씀해 주세요','명단에 없음':'명단에 없는 이름입니다','운영진 암호 미설정':'운영진 암호가 아직 없습니다. 다른 운영진에게 정해 달라고 해 주세요'};
function doLogin(name,v,admin,again){return rpc('login',{p_name:name,p_pin:v}).then(function(j){
  if(j.error){var m=j.error==='번호 형식'?(admin?'6자리 이상 넣어 주세요':'숫자 4자리를 넣어 주세요'):(LOGIN_ERR[j.error]||j.error);if(j.error==='번호 틀림'&&j.left)m+=' (남은 기회 '+j.left+'번)';again(m);return}
  TOK=j.token;ME={member_id:j.member_id,name:j.name,role:j.role};D={};lsSet('sa-token',TOK);lsSet('sa-me',JSON.stringify(ME));
  if(!lsGet('sa-seen'))lsSet('sa-seen',String(Date.now()));toast(j.first?'환영합니다!':'접속 완료',j.role==='admin'?'운영진':j.name);go('home')}).catch(function(e){again(e.message)})}
function pinStep(name,role){var admin=role==='admin';
  if(admin){var draw=function(msg){$('app').innerHTML='<div class="card" style="text-align:center"><div style="font-size:19px;font-weight:800">운영진 접속</div>'+
      '<input type="text" id="an" placeholder="이름" autocomplete="username" style="margin-top:14px"><input type="password" id="pw" placeholder="암호 (6자리 이상)" autocomplete="current-password" style="margin-top:8px">'+
      '<button class="big" id="pwGo" type="button">확인</button><div class="err" id="err">'+esc(msg||'')+'</div><button class="lnk" id="back" type="button">직원 이름 고르기로</button></div>';
      $('back').onclick=showLogin;var f=function(){var n=$('an').value.trim(),v=$('pw').value;if(!n||!v)return;doLogin(n,v,true,function(m){var keep=n;draw(m);$('an').value=keep})};
      $('pwGo').onclick=f;$('pw').onkeydown=function(e){if(e.key==='Enter')f()};$('an').focus()};draw();return}
  rpc('has_pin',{p_name:name}).then(function(has){var first=!has,stage=0,v1='';
    function screen(msg){var title=first?(stage===0?'처음입니다. 쓸 번호 4자리를 정해 주세요':'같은 번호를 한 번 더 넣어 주세요'):'번호를 넣어 주세요';
      $('app').innerHTML='<div class="card" style="text-align:center"><div class="mute">'+esc(name)+'</div><div style="font-size:19px;font-weight:800;margin-top:4px">'+title+'</div>'+
        '<div class="pin" id="dots">'+[0,1,2,3].map(function(){return '<i></i>'}).join('')+'</div><div class="keys" id="keys">'+[1,2,3,4,5,6,7,8,9,'',0,'←'].map(function(k){return k===''?'<span></span>':'<button type="button" data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'+
        '<div class="err" id="err">'+esc(msg||'')+'</div><button class="lnk" id="back" type="button">다른 이름 고르기</button></div>';
      $('back').onclick=showLogin;var buf='';
      function submit(v){if(first&&stage===0){v1=v;stage=1;screen();return}if(first&&v!==v1){stage=0;screen('두 번 넣은 번호가 다릅니다. 처음부터 다시 정해 주세요.');return}doLogin(name,v,false,function(m){screen(m)})}
      $('keys').onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;if(k==='←')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
        [].forEach.call($('dots').children,function(d,i){d.classList.toggle('f',i<buf.length)});if(buf.length===4){var v=buf;buf='';setTimeout(function(){submit(v)},120)}}}
    screen()}).catch(function(e){alert(e.message)})}

/* ---------- 홈: 퀘스트 / 제안함 ---------- */
function showHome(){var yr=kst(Date.now()).getUTCFullYear(),goal=(D.rules._goal||{}).pts||30;
  var done=D.ideas.filter(function(i){return i.status==='done'&&i.done_at&&yearOf(i.done_at)===yr}).length;
  var staff=D.members.filter(function(m){return m.active&&m.role==='staff'}),part={};
  D.mpts.forEach(function(p){if(p.pts>0&&D.mem[p.member_id]&&D.mem[p.member_id].role==='staff')part[p.member_id]=1});
  var king={};D.mpts.forEach(function(p){if(p.rule_key==='done'&&p.pts>0)king[p.member_id]=(king[p.member_id]||0)+p.pts});
  var kid=Object.keys(king).sort(function(a,b){return king[b]-king[a]})[0];
  var quests=D.topics.filter(isQuest),props=D.topics;
  var head=isAdmin()?'<div class="card row"><div class="sp"><b>운영진 모드</b><div class="mute">확인할 것: 새 제안 '+D.topics.filter(function(t){return t.status==='new'}).length+' · 도전 확인 '+D.ideas.filter(function(i){return i.status==='review'}).length+'</div></div></div>'
    :(function(){var tot=myScore(),L=level(tot);return '<div class="card row">'+avatar(L.lv)+'<div class="sp"><div><b>'+esc(ME.name)+'</b> <span class="pill gold">'+esc(L.name)+'</span></div><div class="bar"><i style="width:'+L.pct+'%"></i></div><div class="mute">XP '+tot+(L.next?' · 다음 레벨까지 '+(L.next-tot)+'점':'')+'</div></div></div>'})();
  $('app').innerHTML=head+
   '<div class="mute" style="margin:10px 4px 0">우리 팀 '+yr+' · 클리어 <b class="c-ok">'+done+'</b>/'+goal+' · '+(kst(Date.now()).getUTCMonth()+1)+'월 참여 '+Object.keys(part).length+'/'+staff.length+'명'+(kid?' · 개선왕 <b class="c-gold">'+esc(nm(kid))+'</b>':'')+'</div>'+
   '<div class="seg" id="seg"><button data-s="q" aria-pressed="'+(homeTab==='q')+'">퀘스트 '+quests.length+'</button><button data-s="p" aria-pressed="'+(homeTab==='p')+'">제안함 '+props.length+'</button></div>'+
   '<div id="list">'+(homeTab==='q'?questList(quests):propList(props))+'</div>'+
   '<button class="lnk" onclick="refresh()" style="display:block;margin:18px auto">새로고침</button>';
  $('seg').onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;homeTab=b.dataset.s;showHome()};
  $('app').onclick=function(e){var b=e.target.closest('[data-to]');if(b)go(b.dataset.to)}}
function questList(qs){if(!qs.length)return '<div class="empty">아직 채택된 퀘스트가 없습니다.<br>「＋ 제안하기」로 문제를 올려 주세요!</div>';
  return qs.map(function(t){var cs=challengesOf(t.id),cl=cs.filter(function(i){return i.status==='done'});
    return '<button class="qc" data-to="t/'+t.id+'"><span class="ph">'+firstPic(t.photos)+'</span><span class="tx"><span class="t">'+esc(t.body||'사진 제안')+'</span>'+

function propList(ps){if(!ps.length)return '<div class="empty">아직 제안이 없습니다. 첫 제안을 올려 주세요!</div>';

    '<span class="mute" style="display:block;margin-top:4px">'+propPill(t)+' '+esc(nm(t.author_id))+' · '+ago(t.created_at)+'</span></span></button>'}).join('')}

  $('app').onclick=function(e){var b;
    if(b=e.target.closest('[data-rgo]')){var iid=b.dataset.rgo,inp=$('r-'+iid),v=inp.value.trim();if(!v||busy)return;busy=true;b.disabled=true;
      rpc('post_reply',{p_token:TOK,p_idea:iid,p_body:v}).then(function(j){ptsToast(j.pts,'댓글 고맙습니다');D.at=0;route()}).catch(function(err){alert(err.message);b.disabled=false}).then(function(){busy=false});return}
    if(b=e.target.closest('[data-redo]')){go('c/'+id+'/'+b.dataset.redo);return}
    if(b=e.target.closest('[data-ok]')){judge(b.dataset.ok,true);return}
    if(b=e.target.closest('[data-fix]')){judge(b.dataset.fix,false);return}
    if(b=e.target.closest('[data-hide]')){hidePost(b.dataset.ht,b.dataset.hide);return}};
  $('app').onkeydown=function(e){if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('r-')===0){var b=document.querySelector('[data-rgo="'+e.target.id.slice(2)+'"]');if(b)b.click()}}})}
function challengeCard(i,rs){var me=i.author_id===ME.member_id;
  return '<div class="card ch"><div class="row"><span class="who">'+esc(nm(i.author_id))+'</span><span class="mute">'+ago(i.created_at)+(i.posted_by?' · 운영진이 대신 올림':'')+'</span><span class="sp"></span>'+chPill(i)+'</div>'+
   thumbs(i.after_photos)+(i.body?'<div style="white-space:pre-wrap;margin-top:8px">'+esc(i.body)+'</div>':'')+
   (i.status==='doing'&&i.judge_note?'<div class="mute" style="margin-top:8px"><span class="pill bad">보완</span> '+esc(i.judge_note)+'</div>':'')+
   (i.status==='done'?'<div class="c-ok" style="font-weight:800;margin-top:8px">CLEAR! '+(i.judge_note?'<span class="mute">· '+esc(i.judge_note)+'</span>':'')+'</div>':'')+
   ((me||isAdmin())&&i.status==='doing'?'<button class="btn gold" data-redo="'+i.id+'" type="button" style="margin-top:10px;width:100%">'+(me?'':'운영진이 ')+'고쳐서 다시 올리기</button>':'')+
   (isAdmin()&&i.status==='review'?'<div class="adm row"><button class="btn ok" data-ok="'+i.id+'" type="button" style="flex:1">완료 인정</button><button class="btn bad" data-fix="'+i.id+'" type="button" style="flex:1">보완 필요</button></div>':'')+
   (isAdmin()?'<button class="lnk" data-hide="'+i.id+'" data-ht="idea" type="button">숨김</button>':'')+
   rs.map(function(r){return '<div class="reply"><b>'+esc(nm(r.author_id))+'</b>'+esc(r.body)+'</div>'}).join('')+
   '<div class="rin"><input type="text" id="r-'+i.id+'" placeholder="댓글 달기" maxlength="300"><button class="btn" data-rgo="'+i.id+'" type="button">올리기</button></div></div>'}
function judge(iid,ok){var note='';if(!ok){note=prompt('보완할 점을 적어 주세요 (도전자에게 보입니다)');if(!note)return}
  var i=D.ideas.filter(function(x){return x.id===iid})[0];
  rpc('judge_idea',{p_token:TOK,p_idea:iid,p_ok:ok,p_note:note||'',p_credited:ok?[i.author_id]:null}).then(function(){toast(ok?'클리어!':'보완 요청함');D.at=0;route()}).catch(function(e){alert(e.message)})}
function editText(type,id,cur){var v=prompt('고칠 내용을 넣어 주세요. (이전 내용은 기록에 남습니다)',cur);if(v==null||v===cur)return;
  rpc('edit_post',{p_token:TOK,p_type:type,p_id:id,p_body:v,p_title:null}).then(function(){toast('고쳤습니다');D.at=0;route()}).catch(function(e){alert(e.message)})}
function hidePost(type,id){var r=prompt('숨기는 이유를 적어 주세요. (받은 점수는 회수되고, 기록은 남습니다)');if(!r)return;
  rpc('hide_post',{p_token:TOK,p_type:type,p_id:id,p_reason:r}).then(function(){toast('숨겼습니다');D.at=0;if(type==='idea')route();else go('home')}).catch(function(e){alert(e.message)})}

/* 운영진: 제안 → 채택/보류, 퀘스트 → 마감 */
function adminTopic(t){var q=isQuest(t);
  return '<div class="adm"><b>운영진</b><input type="text" id="arp" placeholder="한 줄 답 (제안자에게 보입니다)" value="'+esc(t.reply||'')+'" style="margin-top:8px">'+
   '<div class="row" style="margin-top:8px;flex-wrap:wrap">'+(q?'<button class="btn" data-st="closed" type="button">퀘스트 마감</button>':'<button class="btn gold" data-st="adopted" type="button">채택 → 퀘스트</button><button class="btn" data-st="held" type="button">보류</button>')+
   '<button class="btn" data-st="'+t.status+'" type="button">답만 저장</button><span class="sp"></span><button class="lnk" data-hide="'+t.id+'" data-ht="topic" type="button">숨김</button></div><div class="err" id="aerr"></div></div>'}
function bindAdminTopic(t){[].forEach.call(document.querySelectorAll('[data-st]'),function(b){b.onclick=function(){
  rpc('set_topic',{p_token:TOK,p_topic:t.id,p_status:b.dataset.st,p_reply:$('arp').value,p_video_url:t.video_url,p_edu_date:t.edu_date,p_risks:t.risks||[]})
    .then(function(){toast(b.dataset.st==='adopted'?'퀘스트가 됐습니다':'저장했습니다');D.at=0;if(b.dataset.st==='adopted')homeTab='q';route()}).catch(function(e){$('aerr').textContent=e.message})}})}

/* ---------- 도전 올리기 / 고쳐서 다시 올리기 ---------- */
function showChallengeForm(tid,iid){var t=D.topics.filter(function(x){return x.id===tid})[0];if(!t){go('home');return}
  var i=iid&&D.ideas.filter(function(x){return x.id===iid})[0],pics=i?(i.after_photos||[]).map(function(p){return{p:p}}):[];
  /* 운영진: 직원 대신 올리기 — 이 퀘스트에 아직 도전 안 한 직원 중에서 고름 */
  var proxy=isAdmin()&&!i,done={};challengesOf(tid).forEach(function(x){done[x.author_id]=1});
  var who=proxy?D.members.filter(function(m){return m.active&&m.role==='staff'&&!done[m.id]}):[];
  $('app').innerHTML='<button class="lnk" onclick="history.back()">← 뒤로</button>'+
   '<div class="card"><div class="mute">'+esc((t.body||'사진 제안').split('\n')[0])+'</div><div style="font-size:19px;font-weight:800;margin-top:4px">'+(i?(i.author_id===ME.member_id?'고쳐서 다시 올리기':esc(nm(i.author_id))+' 도전 고쳐서 다시 올리기'):proxy?'직원 대신 도전 올리기':'내 개선 올리기')+'</div>'+
   (proxy?'<div class="mute" style="margin-top:8px">누구 이름으로 올릴까요? (점수는 그 사람에게 들어갑니다)</div><select id="cw" style="width:100%;margin-top:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px"><option value="">— 직원 고르기 —</option>'+
     who.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+(m.team?' ('+esc(m.team)+')':'')+'</option>'}).join('')+'</select>':'')+
   (i&&i.judge_note?'<div class="mute" style="margin-top:6px"><span class="pill bad">보완</span> '+esc(i.judge_note)+'</div>':'')+
   '<div class="mute" style="margin-top:6px">고친 뒤 모습(사진·PDF)과 어떻게 고쳤는지 적어 주세요. 개선 전 모습은 위 문제 사진으로 대신합니다.</div>'+
   '<div class="pics" id="cp"></div><textarea id="cb" placeholder="예) 양쪽에 보강판을 덧대 용접했습니다" style="margin-top:12px">'+esc(i?i.body||'':'')+'</textarea>'+
   '<div class="err" id="cerr"></div><button class="big" id="cgo" type="button">올리기</button><div class="mute" style="text-align:center;margin-top:8px">운영진이 확인하면 클리어'+(isAdmin()?'':' +'+((D.rules.done||{}).pts||20)+'점')+'</div></div>';
  picsEditor($('cp'),pics,6,'개선 사진·PDF');
  $('cgo').onclick=function(){var wid=proxy?$('cw').value:null;if(proxy&&!wid){$('cerr').textContent='누구 이름으로 올릴지 골라 주세요.';return}
    if(!pics.length){$('cerr').textContent='개선 사진(또는 PDF)을 한 장 이상 넣어 주세요.';return}if(busy)return;busy=true;var btn=$('cgo');btn.disabled=true;btn.textContent='올리는 중…';$('cerr').textContent='';
    uploadAll(pics).then(function(ps){return i?rpc('resubmit_challenge',{p_token:TOK,p_idea:i.id,p_body:$('cb').value,p_photos:ps})
      :proxy?rpc('admin_post_challenge',{p_token:TOK,p_topic:tid,p_member:wid,p_body:$('cb').value,p_photos:ps})
      :rpc('post_challenge',{p_token:TOK,p_topic:tid,p_body:$('cb').value,p_photos:ps})})
    .then(function(j){if(i)toast('다시 올렸습니다','운영진이 확인합니다');else ptsToast(j&&j.pts,'도전 등록!');D.at=0;history.replaceState(null,'','#t/'+tid);route()})
    .catch(function(e){if($('cerr'))$('cerr').textContent=e.message+' — 다시 눌러 주세요.'})
    .then(function(){busy=false;if($('cgo')){$('cgo').disabled=false;$('cgo').textContent='올리기'}})}}

/* ---------- 내 기록 ---------- */
function showMe(){lsSet('sa-seen',String(Date.now()));updateDots();
  var my=D.topics.filter(function(t){return t.author_id===ME.member_id}),myC=D.ideas.filter(function(i){return i.author_id===ME.member_id});
  var lists='<div class="h2">내 제안 '+my.length+'</div>'+(my.length?propList(my):'<div class="empty">아직 제안이 없습니다.</div>')+
    '<div class="h2">내 도전 '+myC.length+'</div>'+(myC.length?myC.map(function(i){var t=D.topics.filter(function(x){return x.id===i.topic_id})[0];
      return '<button class="qc" data-to="t/'+i.topic_id+'"><span class="ph">'+firstPic(i.after_photos)+'</span><span class="tx"><span class="t">'+esc(t?(t.body||'사진 제안'):'')+'</span><span class="mute" style="display:block;margin-top:4px">'+chPill(i)+'</span></span></button>'}).join(''):'<div class="empty">아직 도전이 없습니다.</div>');
  var out='<button class="lnk" id="out" style="display:block;margin:18px auto">로그아웃</button>';
  if(isAdmin()){$('app').innerHTML='<div class="card"><b>운영진</b><div class="mute">운영진은 점수·순위·참여 인원에 들어가지 않고, 직원 화면에는 「운영진」으로만 보입니다.</div></div>'+lists+out;bindMe();return}
  getAll('points?select=*&member_id=eq.'+ME.member_id+'&order=at.desc,id.desc').then(function(ps){
  var tot=myScore(),L=level(tot),clears=myC.filter(function(i){return i.status==='done'}).length;
  var B=[['💡','첫 제안',my.length>0],['🎯','첫 채택',ps.some(function(p){return p.rule_key==='adopt'&&p.pts>0})],['🏆','첫 클리어',clears>=1],
         ['🔧','클리어 3회',clears>=3],['👑','클리어 10회',clears>=10],['💬','댓글 10개',ps.filter(function(p){return(p.rule_key==='comment'||p.rule_key==='photo_comment')&&p.pts>0}).length>=10]];
  $('app').innerHTML='<div class="card row">'+avatar(L.lv)+'<div class="sp"><b>'+esc(ME.name)+'</b> <span class="pill gold">'+esc(L.name)+'</span><div class="bar"><i style="width:'+L.pct+'%"></i></div><div class="mute">XP '+tot+(L.next?' · 다음 레벨까지 '+(L.next-tot)+'점':'')+'</div></div></div>'+
   '<div class="card">'+B.map(function(b){return '<span class="badge'+(b[2]?' got':'')+'"><b>'+b[0]+'</b>'+b[1]+'</span>'}).join('')+'</div>'+lists+
   '<div class="h2">점수 내역</div><div class="card">'+(ps.length?ps.slice(0,50).map(function(p){var r=D.rules[p.rule_key];return '<div class="pl"><span>'+esc(p.rule_key==='adjust'?'운영진 조정':(r?r.label:p.rule_key))+(p.note?' <span class="mute">'+esc(p.note)+'</span>':'')+'</span><span><b class="'+(p.pts<0?'c-bad':'c-gold')+'">'+(p.pts>0?'+':'')+p.pts+'</b> <span class="mute">'+ymd(p.at)+'</span></span></div>'}).join(''):'<div class="empty">아직 점수가 없습니다.</div>')+'</div>'+
   '<div class="mute" style="margin-top:10px">제안 +'+((D.rules.proposal||{}).pts||2)+' · 댓글 +'+((D.rules.comment||{}).pts||1)+' · 도전 +'+((D.rules.join||{}).pts||2)+' · 채택 +'+((D.rules.adopt||{}).pts||5)+' · 클리어 +'+((D.rules.done||{}).pts||20)+' (제안·댓글·도전은 하루 '+((D.rules._cap||{}).pts||5)+'점까지)</div>'+out;
  bindMe()})}
function bindMe(){$('app').onclick=function(e){var b=e.target.closest('[data-to]');if(b)go(b.dataset.to)};
  $('out').onclick=function(){if(!confirm('로그아웃할까요? 다시 들어올 때 번호가 필요합니다.'))return;rpc('logout',{p_token:TOK}).catch(function(){});logoutLocal();draft=null;lsSet('sa-draft',null);showLogin()}}

/* ---------- 시작 ---------- */
(function(){try{fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var t=r.headers.get('etag')||r.headers.get('last-modified');if(!t)return;var o=lsGet('sa-ver');lsSet('sa-ver',t);
  if(o&&o!==t&&!/[?&]v=/.test(location.search))location.replace(location.pathname+'?v='+Date.now())}).catch(function(){})}catch(e){}})();
TOK=lsGet('sa-token');try{ME=JSON.parse(lsGet('sa-me')||'null')}catch(e){ME=null}if(!ME)TOK=null;
if(TOK)rpc('me',{p_token:TOK}).then(function(m){ME={member_id:m.member_id,name:m.name,role:m.role};lsSet('sa-me',JSON.stringify(ME));route()}).catch(function(){if(!TOK)showLogin();else route()});
else showLogin();
</script>
</body>
</html>
